name: Development control map

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate work map
        run: python scripts/work_map.py render
      - name: Require committed control views to match sources
        run: git diff --exit-code -- docs/WORK_MAP.md docs/WORK_STATUS.csv
      - name: Show next actionable work
        run: python scripts/work_map.py next

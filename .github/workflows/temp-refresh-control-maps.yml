name: Temporary control-map refresh

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'feat/development-control-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate derived control views
        run: |
          rm .github/workflows/temp-refresh-control-maps.yml
          python scripts/work_map.py render
          python scripts/work_map.py check
          python scripts/render_repository_map.py
          python scripts/render_repository_map.py --check
      - name: Commit generated views and self-removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/temp-refresh-control-maps.yml docs/WORK_MAP.md docs/WORK_STATUS.csv docs/REPOSITORY_MAP.md
          git commit -m "control-map: regenerate derived views"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

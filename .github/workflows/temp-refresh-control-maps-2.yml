name: Temporary control-map refresh 2

on:
  push:
    branches: [feat/development-control-map]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/development-control-map
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate derived views
        run: |
          rm .github/workflows/temp-refresh-control-maps-2.yml
          python scripts/work_map.py render
          python scripts/work_map.py check
          python scripts/render_repository_map.py
          python scripts/render_repository_map.py --check
      - name: Commit generated views and self-removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/temp-refresh-control-maps-2.yml docs/WORK_MAP.md docs/WORK_STATUS.csv docs/REPOSITORY_MAP.md
          git commit -m "control-map: refresh maps after verification wiring"
          git push origin HEAD:feat/development-control-map

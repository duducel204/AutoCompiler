name: Temporary repository map cleanup

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/cc04-product-resume-seam'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove temporary workflow and regenerate map
        run: |
          rm .github/workflows/temp-refresh-repository-map.yml
          python scripts/render_repository_map.py
          python scripts/render_repository_map.py --check
      - name: Commit clean generated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/temp-refresh-repository-map.yml docs/REPOSITORY_MAP.md
          git commit -m "docs: finalize repository map refresh"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

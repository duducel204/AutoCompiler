name: Temporary repository map refresh

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'docs/capability-closure-map-current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove temporary workflow, regenerate and verify map
        run: |
          rm .github/workflows/temp-refresh-repository-map.yml
          python scripts/render_repository_map.py
          python scripts/render_repository_map.py --check
      - name: Commit generated map and self-removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/temp-refresh-repository-map.yml docs/REPOSITORY_MAP.md
          git commit -m "docs: regenerate repository map"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

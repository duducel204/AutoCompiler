name: Temporary repository map refresh

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/cc04-product-resume-seam'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate map
        run: python scripts/render_repository_map.py
      - name: Commit generated map
        run: |
          if git diff --quiet -- docs/REPOSITORY_MAP.md; then
            echo "Map already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REPOSITORY_MAP.md
          git commit -m "docs: regenerate repository map"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Test capability discovery

on:
  push:
    paths:
      - "src/**"
      - "scripts/discover.py"
      - "tests/**"
      - ".github/workflows/test-capability-discovery.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run discovery
        run: python scripts/discover.py
      - name: Run tests
        run: python tests/test_discover.py -v

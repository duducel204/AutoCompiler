name: Documentation map

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate expected repository map
        run: python scripts/render_repository_map.py

      - name: Upload generated repository map
        uses: actions/upload-artifact@v4
        with:
          name: repository-map-expected
          path: docs/REPOSITORY_MAP.md
          if-no-files-found: error

      - name: Require committed map to match generated map
        run: git diff --exit-code -- docs/REPOSITORY_MAP.md

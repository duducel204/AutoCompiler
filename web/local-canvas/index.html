<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoCompiler Canvas</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#e8edf2;background:#0b0f14}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{padding:12px 18px;border-bottom:1px solid #26313d;display:flex;justify-content:space-between}.layout{display:grid;grid-template-columns:290px 1fr 240px;min-height:0}.side{padding:14px;border-right:1px solid #26313d;background:#10161d;overflow:auto}.side.right{border-right:0;border-left:1px solid #26313d}.canvas{padding:18px;overflow:auto}.card,.node{border:1px solid #334150;border-radius:12px;background:#121a22;padding:12px}.muted{color:#8fa1b3;font-size:12px}.caps{display:grid;gap:8px;margin-top:10px}.cap{padding:8px;border-radius:8px;background:#18222c}.objective{max-width:620px;margin:0 auto 24px}.branches{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:14px;margin-top:28px}.node button,.actions button{margin-top:10px;padding:8px 10px;border:1px solid #486078;border-radius:8px;background:#182b3d;color:#fff;cursor:pointer}.node.active{outline:2px solid #6aa8e8}.stream{border-top:1px solid #26313d;padding:10px 16px;background:#10161d;max-height:160px;overflow:auto;font:12px Consolas,monospace}.event{padding:3px 0}.chat{display:flex;gap:8px;margin-top:16px}.chat input{flex:1;padding:10px;border-radius:8px;border:1px solid #334150;background:#0e141a;color:#fff}.chat button{padding:10px 14px;border:0;border-radius:8px;background:#276fb7;color:white}.repo-meta{margin:8px 0 12px}.tree{font:12px Consolas,monospace;line-height:1.7;white-space:nowrap}.tree-row{overflow:hidden;text-overflow:ellipsis}.tree-dir{font-weight:700}.dirty{color:#e8bd6a}.clean{color:#72c792}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.branches{grid-template-columns:1fr}}
</style></head><body><div class="app">
<header class="top"><strong>AutoCompiler Canvas</strong><span class="muted" id="repo-head">LOCAL · carregando workspace…</span></header>
<div class="layout"><aside class="side"><strong>Repository Workspace</strong><div id="repo-meta" class="repo-meta muted"></div><div id="tree" class="tree">Lendo repositório local…</div></aside>
<main class="canvas"><section class="objective card"><div class="muted">OBJETIVO ATUAL</div><h2 id="goal">Explorar o AutoCompiler visualmente</h2><div class="chat"><input id="input" aria-label="Objetivo" placeholder="Digite um objetivo..."><button id="send">Executar</button></div></section><div class="branches" id="branches"></div></main>
<aside class="side right"><strong>Capabilities</strong><div id="caps" class="caps"><div class="muted">Carregando catálogo…</div></div></aside></div>
<footer class="stream"><div><strong>Execution stream</strong></div><div id="events"></div></footer></div>
<script>
const events=document.querySelector('#events'), branches=document.querySelector('#branches');
function log(type,msg){const e=document.createElement('div');e.className='event';e.textContent=new Date().toLocaleTimeString()+'  '+type+'  '+msg;events.prepend(e)}
function branch(name,text){const n=document.createElement('div');n.className='node';n.innerHTML='<strong>'+name+'</strong><p>'+text+'</p><div class="actions"><button>Explorar</button></div>';n.querySelector('button').onclick=()=>{n.classList.toggle('active');log('branch.selected',name)};branches.appendChild(n)}
branch('A · REUSE','Procurar capacidade já validada.');branch('B · ACQUIRE','Adquirir ou adaptar um provider existente.');branch('C · BUILD','Construir uma capability candidata.');
document.querySelector('#send').onclick=()=>{const i=document.querySelector('#input');const v=i.value.trim();if(!v)return;document.querySelector('#goal').textContent=v;log('objective.received',v);log('gap.analysis','comparando objetivo com repertório atual');i.value=''};
fetch('/api/workspace').then(r=>r.json()).then(w=>{document.querySelector('#repo-head').textContent='LOCAL · '+w.name+' · '+(w.branch||'sem branch')+' @ '+(w.commit||'?');const state=w.clean?'<span class="clean">clean</span>':'<span class="dirty">'+w.changes.length+' alteração(ões)</span>';document.querySelector('#repo-meta').innerHTML='<div>'+w.root+'</div><div>Git: '+state+'</div>';const tree=document.querySelector('#tree');tree.innerHTML='';w.entries.forEach(x=>{const d=document.createElement('div');d.className='tree-row '+(x.type==='directory'?'tree-dir':'');d.style.paddingLeft=(x.depth*12)+'px';d.textContent=(x.type==='directory'?'▸ ':'· ')+x.name;d.title=x.path;tree.appendChild(d)});if(w.truncated){const d=document.createElement('div');d.className='muted';d.textContent='… listagem limitada';tree.appendChild(d)}log('workspace.loaded',w.entries.length+' entradas · '+(w.branch||'sem branch'))}).catch(e=>log('workspace.error',e.message));
fetch('/api/state').then(r=>r.json()).then(s=>{const box=document.querySelector('#caps');box.innerHTML='';const all=s.catalog||[];if(!all.length){box.innerHTML='<div class="muted">Catálogo vazio neste workspace.</div>';return}all.forEach(c=>{const d=document.createElement('div');d.className='cap';d.innerHTML='<div>'+c.capability+'</div><div class="muted">'+c.trust+' · '+c.provider+'</div>';box.appendChild(d)});log('catalog.loaded',all.length+' registros')}).catch(e=>log('catalog.error',e.message));
log('canvas.ready','interface local iniciada');
</script></body></html>
